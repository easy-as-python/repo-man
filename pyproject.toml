[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[project]
requires-python = ">=3.11"
name = "repo-man"
version = "0.2.0"
description = "Manage repositories of a variety of different types."
readme = "README.md"
authors = [
    { name = "Dane Hillard", email = "github@danehillard.com" }
]
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "click>=8.4.1",
    "typer>=0.26.7",
]

[project.urls]
Documentation = "https://repo-man.readthedocs.org"
Repository = "https://github.com/easy-as-python/repo-man"
Issues = "https://github.com/easy-as-python/repo-man/issues"

[project.scripts]
repo-man = "repo_man.cli:main"

[project.optional-dependencies]
docs = [
    "furo",
    "myst-parser",
    "sphinx>=9.0.4,<9.1.0",  # 9.1.0+ only supports Python 3.12+
    "sphinx-autobuild",
]

[tool.uv.build-backend]
module-name = "repo_man"

######################
# Tool configuration #
######################

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]

[tool.mypy]
strict = true
python_version = "3.11"
warn_unused_configs = true
show_error_context = true
pretty = true
namespace_packages = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = ["--cov", "--strict-markers"]
xfail_strict = true

[tool.coverage.run]
source = ["repo_man"]
branch = true

[tool.coverage.report]
fail_under = 95.00
show_missing = true
skip_covered = true

[tool.coverage.paths]
source = [
    "src/repo_man",
    "*/site-packages/repo_man",
]

[tool.tox]
env_list = ["py311", "py312", "py313", "py314"]
isolated_build = true

[tool.tox.env_run_base]
package = "wheel"
wheel_build_env = ".pkg"
deps = [
    "pytest",
    "pytest-cov",
    "pytest-randomly",
]
commands = [
    ["pytest", { replace = "posargs", default = [], extend = true }],
]

[tool.tox.env.typecheck]
extras = [
    "docs",
]
deps = [
    { replace = "ref", of = ["tool", "tox", "env_run_base", "deps"], extend = true },
    "mypy",
    "types-termcolor",
]
commands = [
    ["mypy", { replace = "posargs", default = ["src", "test", "docs"], extend = true }],
]

[tool.tox.env.format]
skip_install = true
deps = [
    "ruff",
]
commands = [
    ["ruff", "format", { replace = "posargs", default = ["--check", "--diff", "src", "test"], extend = true }],
]

[tool.tox.env.lint]
skip_install = true
deps = [
    "ruff",
]
commands = [
    ["ruff", "check", { replace = "posargs", default = ["src", "test", "docs"], extend = true }],
]

[tool.tox.env.docs]
extras = [
    "docs",
]
commands = [
    ["sphinx-apidoc", "--force", "--implicit-namespaces", "--module-first", "--separate", "-o", "docs/reference", "src/repo_man/"],
    ["sphinx-build", "-n", "-W", "--keep-going", "-b", "html", "docs/", "docs/_build/"],
]

[tool.tox.env.devdocs]
extras = [
    "docs",
]
commands = [
    ["sphinx-apidoc", "--force", "--implicit-namespaces", "--module-first", "--separate", "-o", "docs/reference", "src/repo_man/"],
    ["sphinx-autobuild", "-n", "-W", "-b", "html", "docs/", "docs/_build/"],
]
